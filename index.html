<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가을 책방">
<title>루퍼드의 가을 책방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <header class="bar" id="bar">
    <span class="name" id="barName">루퍼드의 가을 책방</span><span class="date" id="barDate"></span><span class="sp"></span>
    <button class="chip" id="btnWardrobe">옷장</button><button class="chip" id="btnWords">낱말 서랍</button><button class="chip" id="btnParent">부모님</button><button class="chip" id="btnHome" hidden>책방으로</button>
  </header>
  <main id="screen"></main>
  <footer class="talk" id="talk" hidden>
    <img id="talkFace" alt=""><span class="who" id="talkWho"></span>
    <div class="bub"><span id="talkText"></span></div>
  </footer>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
